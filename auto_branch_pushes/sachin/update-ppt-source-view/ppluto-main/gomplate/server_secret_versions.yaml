# Pins GCP Secret Manager version of each key in the ppluto-server-secret-<hash> k8s Secret.
# KEY: env var name, synced from Secret Manager secret `prod-<KEY>`.
# Value: pinned GCP Secret Manager version, as a quoted string ("2", not 2 or "latest").
SERVER_SECRET_VERSIONS:
  TEST_SM_SECRET_VERSION: "3"
  
  PLUTO_TEMPORAL_API_KEY: "1"
  PLUTO_PINECONE_API_KEY: "1"
  
  PLUTO_GOOGLE_APPLICATION_CREDENTIALS_JSON: "1"
  PLUTO_CLAUDE_API_KEY: "1"
  PLUTO_OPENROUTER_API_KEY: "1"
  PLUTO_OPENAI_API_KEY_PPLUTO_B: "1"
  
  # MySQL URLs - rotate all together
  PLUTO_MYSQL_READ_WRITE_URL: "2" # in-VPC IP
  PLUTO_MYSQL_READ_ONLY_URL: "2" # in-VPC IP
  PLUTO_MYSQL_PUBLIC_URL: "2" # public IP
  PLUTO_MYSQL_CI_URL: "2" # drone cloud-sql-proxy IP
  PLUTO_OPENFGA_MYSQL_URL: "2" # in-VPC IP (DSN)
  PLUTO_OPENFGA_MYSQL_PUBLIC_URL: "1" # public IP (DSN)

  PLUTO_AWS_ACCESS_KEY: "1"
  PLUTO_AWS_SECRET_KEY: "1"
  PLUTO_BEDROCK_AWS_ACCESS_KEY: "1"
  PLUTO_BEDROCK_AWS_SECRET_KEY: "1"
