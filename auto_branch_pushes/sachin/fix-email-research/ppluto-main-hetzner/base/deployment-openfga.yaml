
kind: Deployment
apiVersion: apps/v1
metadata:
  name: ppluto-openfga
  namespace: default
spec:
  selector:
    matchLabels:
      app: ppluto-openfga
  replicas: {{ .PPLUTO_OPENFGA_HETZNER_DEPLOYMENT_REPLICAS }}
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: ppluto-openfga
    spec:
      tolerations:
        - key: "node.pluto.co/purpose"
          operator: "Equal"
          value: "temporal"
          effect: "NoSchedule"
      nodeSelector:
        node.pluto.co/purpose: temporal
      containers:
        - name: openfga
          image: openfga/openfga:v1.18.1
          args: ["run"]
          env:
            - name: OPENFGA_DATASTORE_ENGINE
              value: mysql
            - name: OPENFGA_DATASTORE_URI
              valueFrom:
                secretKeyRef:
                  name: ppluto-db-secret
                  key: OPENFGA_DATASTORE_URI
            # Pool caps (OpenFGA defaults, pinned): 30 open/pod x 2 replicas = 60
            # conns here, on top of GKE's 90, vs MySQL max_connections 4030.
            - name: OPENFGA_DATASTORE_MAX_OPEN_CONNS
              value: "30"
            - name: OPENFGA_DATASTORE_MAX_IDLE_CONNS
              value: "10"
            - name: OPENFGA_PLAYGROUND_ENABLED
              value: "false"
            - name: OPENFGA_LOG_FORMAT
              value: json
            - name: OPENFGA_METRICS_ENABLED
              value: "true"
            - name: OPENFGA_LIST_OBJECTS_DEADLINE
              value: "0s"
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 8081
            - name: metrics
              containerPort: 2112
          readinessProbe:
            httpGet:
              port: 8080
              path: /healthz
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              port: 8080
              path: /healthz
            timeoutSeconds: 5
            failureThreshold: 6
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: ppluto-openfga-service
  namespace: default
spec:
  selector:
    app: ppluto-openfga
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 8081
      targetPort: 8081
