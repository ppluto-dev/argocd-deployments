# Helm values for External Secrets Operator on the Hetzner k3s cluster. See docs/hetzner-deployment.md.
# ESO authenticates to GCP Secret Manager via Workload Identity Federation (pool hetzner-temporal-k3s,
# provider k3s-oidc): the controller presents a projected service-account token, no key file.
# Worker nodes are tainted node.pluto.co/purpose=temporal; all ESO pods schedule there like openfga.
nodeSelector: &nodeSelector
  node.pluto.co/purpose: temporal
tolerations: &tolerations
  - key: node.pluto.co/purpose
    operator: Equal
    value: temporal
    effect: NoSchedule
webhook:
  nodeSelector: *nodeSelector
  tolerations: *tolerations
certController:
  nodeSelector: *nodeSelector
  tolerations: *tolerations
extraVolumes:
  - name: gcp-token
    projected:
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 3600
            audience: "//iam.googleapis.com/projects/772316955869/locations/global/workloadIdentityPools/hetzner-temporal-k3s/providers/k3s-oidc"
  - name: gcp-credential-config
    configMap:
      name: gcp-credential-config
extraVolumeMounts:
  - name: gcp-token
    mountPath: /var/run/secrets/gcp
    readOnly: true
  - name: gcp-credential-config
    mountPath: /etc/gcp
    readOnly: true
extraEnv:
  - name: GOOGLE_APPLICATION_CREDENTIALS
    value: /etc/gcp/credential-config.json
