apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ppluto-sm-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: ppluto-sm-secrets
    creationPolicy: Owner
  data:
{{- range $key, $version := .SECRET_VERSIONS }}
    - secretKey: {{ $key }}
      remoteRef:
        key: prod-{{ $key }}
        version: "{{ $version }}"
{{- end }}
