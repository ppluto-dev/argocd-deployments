# Pins GCP Secret Manager version of each key in the ppluto-server-secret-<hash> k8s Secret.
# KEY: env var name, synced from Secret Manager secret `prod-<KEY>`.
# Value: pinned GCP Secret Manager version, as a quoted string ("2", not 2 or "latest").
SERVER_SECRET_VERSIONS:
  TEST_SM_SECRET_VERSION: "3"
  PLUTO_TEMPORAL_API_KEY: "1"
  PLUTO_GOOGLE_APPLICATION_CREDENTIALS_JSON: "1"
  PLUTO_CLAUDE_API_KEY: "1"
  # MySQL URLs with credentials. *_URL = in-VPC IP (GKE pods via envFrom);
  # PUBLIC_URL = public IP (Hetzner, laptops); CI_URL = the Drone cloud-sql-proxy
  # service (runner IPs are not on the Cloud SQL authorized list; no sslaccept, the
  # proxy terminates TLS).
  PLUTO_MYSQL_READ_WRITE_URL: "2"
  PLUTO_MYSQL_READ_ONLY_URL: "2"
  PLUTO_MYSQL_PUBLIC_URL: "2"
  PLUTO_MYSQL_CI_URL: "2"
  # OpenFGA datastore DSNs (Go format, with credentials). *_URL = public IP (Hetzner,
  # CI, laptops); PRIVATE_URL = in-VPC IP (GKE).
  PLUTO_OPENFGA_MYSQL_URL: "1"
  PLUTO_OPENFGA_MYSQL_PRIVATE_URL: "2"
