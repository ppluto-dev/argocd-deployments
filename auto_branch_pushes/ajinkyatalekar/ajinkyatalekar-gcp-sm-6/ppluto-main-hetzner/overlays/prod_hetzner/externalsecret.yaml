# Same ExternalSecret as ppluto-main/base: named ppluto-server-secret-<hash of SERVER_SECRET_VERSIONS>
# via gomplate/server_secret_name.tmpl; a pin change creates a new Secret. Synced by the Hetzner ESO,
# which reads GCP Secret Manager through the hetzner-temporal-k3s Workload Identity pool.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ppluto-server-secret-86527c4d96
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: PruneLast=true
spec:
  refreshInterval: 0s # Sync once
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: ppluto-server-secret-86527c4d96
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/name: ppluto-server-secret
  data:
    - secretKey: TEST_SM_SECRET_VERSION
      remoteRef:
        key: prod-TEST_SM_SECRET_VERSION
        version: "1"
