apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: ppluto-main-monitoring-2
  labels:
    app.kubernetes.io/name: ppluto-main
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ppluto-main
  endpoints:
  - port: metrics
    interval: 30s
