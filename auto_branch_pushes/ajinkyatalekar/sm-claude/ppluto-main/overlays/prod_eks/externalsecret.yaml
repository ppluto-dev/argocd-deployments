# Named ppluto-server-secret-<hash of SERVER_SECRET_VERSIONS> via gomplate/server_secret_name.tmpl; a pin change creates a new Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ppluto-server-secret-01f0d0b946
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: PruneLast=true
spec:
  refreshInterval: 0s # Sync once
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: ppluto-server-secret-01f0d0b946
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/name: ppluto-server-secret
  data:
    - secretKey: PLUTO_CLAUDE_API_KEY
      remoteRef:
        key: prod-PLUTO_CLAUDE_API_KEY
        version: "1"
    - secretKey: PLUTO_TEMPORAL_API_KEY
      remoteRef:
        key: prod-PLUTO_TEMPORAL_API_KEY
        version: "1"
    - secretKey: TEST_SM_SECRET_VERSION
      remoteRef:
        key: prod-TEST_SM_SECRET_VERSION
        version: "3"
