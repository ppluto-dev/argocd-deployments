kind: Deployment
apiVersion: apps/v1
metadata:
  name: ppluto-collabora
spec:
  selector:
    matchLabels:
      app: ppluto-collabora
  replicas: 1
  revisionHistoryLimit: 2
  template:
    metadata:
      labels:
        app: ppluto-collabora
    spec:
      containers:
        - name: collabora
          image: collabora/code:26.04.4.2.1
          env:
            # Only http_api (in-cluster) may serve WOPI files to Collabora.
            - name: aliasgroup1
              value: http://ppluto-main-service-active:83
            - name: username
              value: admin
            - name: password
              valueFrom:
                secretKeyRef:
                  name: ppluto-server-secret-1223d15810
                  key: PLUTO_COLLABORA_ADMIN_PASSWORD
                  optional: true
            # Each post_allow/lok_allow index replaces one private-range default in the image's
            # coolwsd.xml; all must be overridden or convert-to stays reachable via the ingress.
            - name: extra_params
              value: >-
                --o:ssl.enable=false
                --o:ssl.termination=true
                --o:net.service_root=/collabora
                --o:admin_console.enable=true
                --o:num_prespawn_children=2
                --o:per_document.idle_timeout_secs=600
                --o:per_document.max_concurrency=2
                --o:per_document.cleanup.limit_dirty_mem_mb=1024
                --o:per_view.out_of_focus_timeout_secs=120
                --o:net.post_allow.host[0]=127.0.0.1/32
                --o:net.post_allow.host[1]=127.0.0.1/32
                --o:net.post_allow.host[2]=127.0.0.1/32
                --o:net.post_allow.host[3]=127.0.0.1/32
                --o:net.post_allow.host[4]=127.0.0.1/32
                --o:net.lok_allow.host[0]=127.0.0.1/32
                --o:net.lok_allow.host[1]=127.0.0.1/32
                --o:net.lok_allow.host[2]=127.0.0.1/32
                --o:net.lok_allow.host[3]=127.0.0.1/32
                --o:net.lok_allow.host[4]=127.0.0.1/32
                --o:net.lok_allow.host[5]=127.0.0.1/32
          ports:
            - name: http
              containerPort: 9980
          readinessProbe:
            httpGet:
              port: 9980
              path: /collabora/hosting/discovery
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              port: 9980
              path: /collabora/hosting/discovery
            timeoutSeconds: 5
            failureThreshold: 6
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ppluto-collabora-pdb
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: ppluto-collabora
